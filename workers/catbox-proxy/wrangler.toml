name = "catbox-proxy"
main = "worker.js"
compatibility_date = "2024-01-01"
workers_dev = true

[vars]
# Catbox userhash (tie uploads to the account, makes them permanent and skips
# Catbox's "Invalid uploader" / 412 abuse rejection on datacenter IPs). The Go
# client also sends this explicitly when CATBOX_USERHASH is set in .env; this
# [vars] keeps the Worker working for callers that don't.
CATBOX_USERHASH = "c81dfb89395e73d5335bb65da"
