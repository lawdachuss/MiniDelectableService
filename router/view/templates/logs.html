<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Logs — StreamBate</title>
    <script>
        (function(){
            if (localStorage.getItem('darkMode') === 'true' ||
                (localStorage.getItem('darkMode') === null && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            }
        })();
    </script>
    <style>
        :root {
            --bg-body: #0a0a0c;
            --bg-surface: #121216;
            --bg-card: #1a1a20;
            --bg-input: rgba(255,255,255,0.04);
            --text-primary: #e4e4e7;
            --text-secondary: #a1a1aa;
            --text-muted: #52525b;
            --border-color: rgba(255,255,255,0.06);
            --border-subtle: rgba(255,255,255,0.08);
            --accent: #d4a053;
        }
        html:not(.dark) {
            --bg-body: #f4f4f5;
            --bg-surface: #ffffff;
            --bg-card: #fafafa;
            --bg-input: #f4f4f5;
            --text-primary: #18181b;
            --text-secondary: #52525b;
            --text-muted: #a1a1aa;
            --border-color: #e4e4e7;
            --border-subtle: #d4d4d8;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'DM Sans', system-ui, sans-serif;
            background: var(--bg-body);
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            font-size: 13px;
            line-height: 1.5;
        }
        .layout { max-width: 1400px; margin: 0 auto; padding: 24px 32px; }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 18px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--border-color);
            flex-wrap: wrap;
        }
        .header h1 {
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            font-size: 22px;
            margin: 0;
        }
        .header .nav-links { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .header .nav-links a {
            font-size: 12px;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 8px;
            background: var(--bg-input);
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            text-decoration: none;
            transition: all 0.2s;
        }
        .header .nav-links a:hover { background: var(--bg-card); color: var(--text-primary); text-decoration: none; }

        .toolbar {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }
        .toolbar .field {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-secondary);
            background: var(--bg-input);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            padding: 6px 12px;
        }
        .toolbar input[type="text"] {
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 12px;
            width: 260px;
        }
        .toolbar .pill {
            font-size: 11px;
            font-weight: 600;
            padding: 2px 10px;
            border-radius: 6px;
            background: rgba(212,160,83,0.15);
            color: var(--accent);
        }
        .toolbar button {
            font-size: 11px;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid var(--border-subtle);
            background: var(--bg-input);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
        }
        .toolbar button:hover { background: var(--bg-card); color: var(--text-primary); }

        .log-wrap {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
        }
        .log-scroll {
            height: calc(100vh - 210px);
            min-height: 320px;
            overflow-y: auto;
            padding: 12px 16px;
            font-family: ui-monospace, 'Cascadia Code', Consolas, monospace;
            font-size: 11.5px;
            line-height: 1.55;
        }
        .line { white-space: pre-wrap; word-break: break-all; padding: 0; }
        .line:hover { background: rgba(255,255,255,0.03); }
        .line .ts { color: var(--text-muted); margin-right: 8px; }
        .line.err .ts { color: #ef4444; }
        .line .stream { font-size: 9px; font-weight: 700; padding: 1px 5px; border-radius: 4px; margin-right: 8px; vertical-align: 1px; }
        .line .stream.err { background: rgba(239,68,68,0.15); color: #ef4444; }
        .line .stream.app { background: rgba(59,130,246,0.15); color: #3b82f6; }
        .empty { color: var(--text-muted); padding: 24px; text-align: center; }

        @media (max-width: 768px) {
            .layout { padding: 12px 16px; }
            .toolbar input[type="text"] { width: 100%; }
            .log-scroll { height: calc(100vh - 250px); }
        }
    </style>
</head>
<body>
<div class="layout">
    <div class="header">
        <h1>Logs</h1>
        <div class="nav-links">
            <a href="/">Dashboard</a>
            <a href="/admin">Admin</a>
            <a href="/videos">Videos</a>
        </div>
    </div>

    <div class="toolbar">
        <div class="field">
            <span>🔎</span>
            <input type="text" id="filter" placeholder="Filter logs (regex)...">
        </div>
        <label class="field">
            <input type="checkbox" id="autoscroll" checked style="accent-color:var(--accent);margin:0;width:14px;height:14px">
            Autoscroll
        </label>
        <span class="pill" id="count">0 lines</span>
        <button onclick="clearLogs()">Clear</button>
    </div>

    <div class="log-wrap">
        <div class="log-scroll" id="scroll"></div>
    </div>
</div>

<script>
(function(){
    var scrollEl = document.getElementById('scroll');
    var filterEl = document.getElementById('filter');
    var autoscrollEl = document.getElementById('autoscroll');
    var countEl = document.getElementById('count');
    var last = 0;
    var lines = [];
    var filter = '';

    function esc(s) {
        return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function render() {
        var q;
        try { q = new RegExp(filter, 'i'); } catch(e) { q = null; }
        var html = '';
        var shown = 0;
        for (var i = 0; i < lines.length; i++) {
            var l = lines[i];
            if (q && !q.test(l.line)) continue;
            shown++;
            html += '<div class="line' + (l.stream === 'stderr' ? ' err' : '') + '">' +
                '<span class="ts">' + esc(l.time) + '</span>' +
                '<span class="stream ' + (l.stream === 'stderr' ? 'err' : 'app') + '">' + (l.stream === 'stderr' ? 'ERR' : 'LOG') + '</span>' +
                esc(l.line) + '</div>';
        }
        scrollEl.innerHTML = html || '<div class="empty">No logs yet</div>';
        countEl.textContent = lines.length + ' lines' + (filter ? ' (' + shown + ' shown)' : '');
    }

    function tick() {
        fetch('/api/logs?after=' + last).then(function(r){ return r.json(); }).then(function(data){
            if (!data || !data.lines) return;
            for (var i = 0; i < data.lines.length; i++) {
                var e = data.lines[i];
                lines.push({
                    time: new Date(e.time).toLocaleTimeString(),
                    stream: e.stream,
                    line: e.line
                });
                last = Math.max(last, e.index + 1);
            }
            if (lines.length > 5000) lines = lines.slice(lines.length - 5000);
            render();
            if (autoscrollEl.checked) scrollEl.scrollTop = scrollEl.scrollHeight;
        }).catch(function(){ /* transient */ });
    }

    filterEl.addEventListener('input', function(){ filter = filterEl.value; render(); });
    window.clearLogs = function(){ lines = []; render(); };

    render();
    setInterval(tick, 2000);
    tick();
})();
</script>
</body>
</html>
