name: Test ImgChest Upload
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get runner IP
        run: echo "Runner IP: $(curl -s https://api.ipify.org)"

      - name: Create test image
        run: |
          # Create a minimal valid JPEG using ImageMagick
          convert -size 32x32 xc:red /tmp/test.jpg 2>/dev/null || \
          python3 -c "
          import struct
          # Minimal JPEG: SOI + APP0 + DQT + SOF0 + DHT + SOS + EOI
          f = open('/tmp/test.jpg', 'wb')
          f.write(b'\xff\xd8\xff\xe0\x00\x10JFIF\x00\x01\x01\x00\x00\x01\x00\x01\x00\x00')
          f.write(b'\xff\xd9')
          f.close()
          "
          ls -la /tmp/test.jpg

      - name: Test ImgChest upload
        run: |
          echo "=== ImgChest API test from runner ==="
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST "https://api.imgchest.com/v1/post" \
            -H "Authorization: Bearer ${{ secrets.IMGCHEST_TOKEN }}" \
            -F "title=github_runner_test" \
            -F "privacy=hidden" \
            -F "nsfw=true" \
            -F "images[]=@/tmp/test.jpg")
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          
          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"

      - name: Check connectivity
        run: |
          echo "=== DNS resolution ==="
          nslookup api.imgchest.com || dig api.imgchest.com
          
          echo "=== Connection test ==="
          curl -v --max-time 10 "https://api.imgchest.com/" 2>&1 | grep -E "(HTTP|Connected|Trying|SSL)" | head -10
